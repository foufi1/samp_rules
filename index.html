<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع Crown State للقوانين</title>
    
    <!-- Meta Tags -->
    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="موقع Crown State للقوانين والمفاهيم">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: #060606;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        
        /* الخط النبضي المتحرك والمضيء في الخلفية الهيكلية للموقع */
        .neon-pulse-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #ffcc00, #ffaa00, transparent);
            background-size: 200% 100%;
            animation: pulseGlow 3s linear infinite;
            z-index: 9999;
            box-shadow: 0 2px 15px rgba(255, 204, 0, 0.6);
        }

        @keyframes pulseGlow {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding-bottom: 40px;
            padding-top: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        header h1 {
            font-size: 2.8rem;
            margin-bottom: 5px;
            background: linear-gradient(to right, #ffcc00, #ffaa00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .logo {
            font-size: 3.5rem;
            color: #ffcc00;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .app {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .buttons-container {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        /* صندوق القوانين المطور والمحاط بإطار ينبض بحركة احترافية */
        .rules-container {
            flex: 2.5;
            min-width: 320px;
            background: #111111;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 204, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        /* خط نبضي داخلي متحرك لتحديد المربع الرئيسي */
        .rules-container::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            border: 1.5px solid transparent;
            background: linear-gradient(135deg, #ffcc00, transparent, #ffaa00) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            opacity: 0.4;
            animation: borderPulse 4s ease-in-out infinite;
        }

        @keyframes borderPulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.6; }
        }
        
        .rules-container h2 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #ffcc00;
            border-bottom: 2px solid rgba(255, 204, 0, 0.2);
            padding-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 2;
        }
        
        .rules-container h2 i {
            color: #ffaa00;
        }
        
        .rules-list {
            list-style: none;
            max-height: 650px;
            overflow-y: auto;
            padding-right: 5px;
            position: relative;
            z-index: 2;
        }
        
        .rules-list::-webkit-scrollbar {
            width: 6px;
        }
        
        .rules-list::-webkit-scrollbar-track {
            background: #111111;
        }
        
        .rules-list::-webkit-scrollbar-thumb {
            background: #ffcc00;
            border-radius: 10px;
        }
        
        .rules-list li {
            padding: 18px;
            margin-bottom: 15px;
            background: #161616;
            border-radius: 12px;
            border-right: 4px solid #ffcc00;
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), background 0.2s ease;
            will-change: transform;
            font-size: 1.1rem;
            line-height: 1.7;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .rules-list li:hover {
            background: #1c1c1c;
            transform: scale(1.01) translateX(-3px);
            border-right-color: #ffaa00;
        }
        
        .rules-list li span.index-num {
            font-weight: 700;
            color: #ffcc00;
            margin-left: 8px;
            background: rgba(255, 204, 0, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .rules-list li strong.concept-title {
            color: #ffcc00;
            font-weight: 700;
            display: inline-block;
            border-left: 1px solid rgba(255,255,255,0.1);
            padding-left: 8px;
            margin-left: 5px;
        }
        
        .rule-btn {
            padding: 18px 22px;
            background: #111111;
            border: 1px solid rgba(255, 204, 0, 0.1);
            border-radius: 14px;
            color: #dddddd;
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: space-between;
            will-change: transform;
        }
        
        .rule-btn i {
            font-size: 1.4rem;
            margin-left: 12px;
            color: #ffcc00;
            vertical-align: middle;
            transition: transform 0.2s ease;
        }
        
        .rule-btn:hover {
            background: #161616;
            border-color: rgba(255, 204, 0, 0.4);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .rule-btn:hover i {
            transform: scale(1.1);
        }
        
        .rule-btn.active {
            background: #1a1a1a;
            border: 1px solid #ffcc00;
            color: #ffcc00;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.15);
        }

        .rule-btn.active i {
            color: #ffaa00;
        }
        
        @media (max-width: 768px) {
            .app { flex-direction: column; }
            header h1 { font-size: 2.2rem; }
            .rule-btn { padding: 15px 18px; font-size: 1.05rem; }
            .rules-container { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- الخط النبضي المضيء بأعلى الشاشة -->
    <div class="neon-pulse-line"></div>
    
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-gavel"></i>
            </div>
            <h1>Crown State</h1>
        </header>
        
        <main class="app">
            <div class="buttons-container">
                <button class="rule-btn active" data-rule="concepts">
                    <div>
                        <i class="fas fa-book"></i>
                        مفاهيم الرول بلاي الأساسية
                    </div>
                </button>

                <button class="rule-btn" data-rule="city">
                    <div>
                        <i class="fas fa-city"></i>
                        قوانين المدينة العامة
                    </div>
                </button>
                
                <button class="rule-btn" data-rule="police">
                    <div>
                        <i class="fas fa-car-on"></i>
                        قوانين الشرطة
                    </div>
                </button>
                
                <button class="rule-btn" data-rule="gangs">
                    <div>
                        <i class="fas fa-user-secret"></i>
                        قوانين العصابات
                    </div>
                </button>
                
                <button class="rule-btn" data-rule="driving">
                    <div>
                        <i class="fas fa-car"></i>
                        قوانين القيادة
                    </div>
                </button>
                
                <button class="rule-btn" data-rule="hospital">
                    <div>
                        <i class="fas fa-ambulance"></i>
                        قوانين المستشفى
                    </div>
                </button>
                
                <button class="rule-btn" data-rule="chat">
                    <div>
                        <i class="fas fa-comments"></i>
                        قوانين الدردشة
                    </div>
                </button>
            </div>
            
            <div class="rules-container">
                <h2 id="rules-title"><i class="fas fa-book"></i> مفاهيم الرول بلاي الأساسية</h2>
                <ul class="rules-list" id="rules-list">
                    <!-- التعبئة التلقائية السلسة عبر جافاسكريبت -->
                </ul>
            </div>
        </main>
    </div>

    <script>
        // دمج مفاهيم الرول بلاي الجديدة وتنسيقها وترتيبها بالكامل
        const rulesData = {
            concepts: [
                "<b>Role Play</b> : يجب عليك تقمص الشخصية داخل الرول بلاي سواء كانت شخصيتك - مسعف ، عسكري ، عصابة.",
                "<b>Meta Gaming</b> : يمنع استخدام المعلومات المتحصل عليها خارج الرول بلاي.",
                "<b>Free-Kill (RDM)</b> : يمنع القتل العمدي بدون سبب.",
                "<b>Car-Kill (VDM)</b> : يمنع دهس المواطنين بالسيارة بأي شكل من الاشكال.",
                "<b>Bunny Jump</b> : يمنع القفز بشكل متكرر للتقدم بشكل أسرع.",
                "<b>New Life Rules</b> : في حال دخولك في غيبوبة يجب نسيان من 10 الى 20 دقيقة عند عودتك.",
                "<b>Fairplay</b> : التحلي بالروح الرياضية والالتزام باللعب النظيف.",
                "<b>Fuir RP</b> : يمنع الخروج من السيرفر عمداً للهروب من السيناريو القائم.",
                "<b>HRP</b> : يمنع التكلم خارج الرول بلاي أو استعمال مصطلحات خارجة عن النطاق الواقعي.",
                "<b>Mort-RP</b> : الموت النهائي لشخصيتك يجبرك على إنشاء شخصية جديدة بالكامل.",
                "<b>Pain RP</b> : يجب التظاهر بالألم والتفاعل الواقعي عند التعرض لحادث أو ضرب.",
                "<b>Force-RP</b> : يمنع إجبار شخص على قبول شروطك دون سماع شروطه وإعطائه مساحة للرد.",
                "<b>Revenge-Kill</b> : يمنع الانتقام من شخص قام بقتلك سابقاً فور عودتك.",
                "<b>Power Gaming</b> : يمنع القيام بأفعال خارقة للطبيعة لا يمكن حدوثها بالواقع.",
                "<b>Masse-RP</b> : يجب أن تأخذ بعين الاعتبار وجود سكان خلفيين وعدم دخول أماكن لا يحق لك دخولها.",
                "<b>HELP</b> : يمنع طلب مدني للإسعاف في حال وجود المسعفين على رأس عملهم.",
                "<b>Record</b> : يجب تشغيل برنامج تصوير دائم مع الصوت أثناء اللعب (بحد أدنى 10 دقائق من المقطع).",
                "<b>Prohibited items</b> : يمنع بيع أو شراء الممنوعات في المناطق الآمنة والمكتظة بالسكان."
            ],
            city: [
                "الالتزام بهذه المصطلحات داخل المدينة ضروري، أي تهاون في هذه القوانين يصدر عنه عقوبات صارمة.",
                "Server : يعني المدينة",
                "Ban : يعني عمرة",
                "Admin : يعني شبح / جن",
                "Bot : يعني مدني",
                "Skin : يعني لباس",
                "id : يعني سيسيبي (ccp)",
                "Lag / Glitch : يعني سحر / صداع",
                "Discord : يعني الراديو الكبير",
                "Announce : يعني الجريدة",
                "Mic : يعني الحنجرة / أحبال صوتية",
                "Restart Server : يعني إعصار",
                "Afk : يعني راه معا مخو",
                "Chat : يعني الورقة",
                "Stash / Cmd : يعني عضلة",
                "Rules : يعني القوانين / الدستور",
                "Record : يعني العين ( 👀 )"
            ],
            police: [
                "يجب على ضباط الشرطة الالتزام بالزي الرسمي للشرطة أثناء الخدمة",
                "يمنع على ضباط الشرطة استخدام القوة المفرطة ضد المواطنين",
                "يجب إبلاغ المشتبه بهم بحقوقهم قبل توقيفهم أو استجوابهم",
                "يمنع على ضباط الشرطة تقديم معلومات كاذبة أو تلفيق تهم",
                "يجب على ضباط الشرطة الحفاظ على السرية المهنية وعدم إفشاء معلومات خاصة",
                "يمنع استخدام مركبات الشرطة لأغراض شخصية غير رسمية",
                "يجب على ضباط الشرطة تقديم تقارير دقيقة عن جميع الحوادث التي يشاركون فيها",
                "يمنع التعاون مع المجرمين أو العصابات بأي شكل من الأشكال"
            ],
            gangs: [
                "يجب على أعضاء العصابات الالتزام بلباس العصابة المميز أثناء الأنشطة",
                "يمنع الاعتداء على المدنيين العزل دون سبب مقنع يتناسب مع سياق الرول بلاي",
                "يجب الحصول على إذن من قادة العصابة قبل البدء بأي عملية إجرامية كبرى",
                "يمنع التعاون مع أفراد الشرطة أو الكشف عن معلومات العصابة لهم",
                "يجب احترام مناطق النفوذ للعصابات الأخرى وعدم التعدي عليها دون سبب",
                "يمنع قتل أو اعتقال أعضاء العصابة من قبل بعضهم البعض دون سبب مقنع",
                "يجب الحفاظ على سرية هوية أعضاء العصابة وأنشتطها من العامة",
                "يمنع تجنيد أعضاء جدد دون موافقة قادة العصابة"
            ],
            driving: [
                "يجب الالتزام بإشارات المرور والقواعد العامة للقيادة داخل المدينة",
                "يمنع القيادة بسرعة عالية في المناطق السكنية أو المزدحمة",
                "يجب حمل رخصة قيادة سارية المفعول أثناء القيادة",
                "يمنع القيادة بمركبة مسروقة بشكل واضح في مناطق الشرطة",
                "يجب إصلاح المركبات التالفة قبل استخدامها على الطرقات العامة",
                "يمنع إجراء سباقات السيارات غير المصرح بها في الشوارع العامة",
                "يجب الوقوف عند نقاط التفتيش الشرطية عند الطلب",
                "يمنع استخدام المركبات كأداة للاعتداء على الآخرين عمداً"
            ],
            hospital: [
                "يجب على الأطباء والممرضين الالتزام بالزي الطبي الرسمي أثناء العمل",
                "يمنع رفض تقديم العلاج للمرضى أو المصابين دون سبب طبي مقنع",
                "يجب الحفاظ على سرية المعلومات الطبية للمرضى وعدم إفشائها",
                "يمنع تزوير التقارير الطبية أو إصدار شهادات مزورة",
                "يجب تقديم الإسعافات الأولية فوراً للحالات الطارئة",
                "يمنع استخدام معدات المستشفى أو الأدوية لأغراض شخصية",
                "يجب التعامل باحترافية واحترام مع جميع المرضى بغض النظر عن هويتهم",
                "يمنع التعاون مع المجرمين في تزوير الإصابات أو تقديم معلومات كاذبة"
            ],
            chat: [
                "يمنع استخدام لغة غير لائقة أو مهينة في القنوات العامة",
                "يجب استخدام القنوات المناسبة لنوع المحادثة (عام، محلي، خاص)",
                "يمنع الإعلان عن منتجات أو خدمات غير مصرح بها في القنوات العامة",
                "يجب عدم نشر معلومات شخصية للاعبين آخرين دون إذنهم",
                "يمنع التشويش أو إرسال رسائل متكررة في القنوات النصية أو الصوتية",
                "يجب استخدام اللغة العربية الفصحى أو العامية المفهومة في المحادثات",
                "يمنع التحريض على العنف أو الكراهية بأي شكل من الأشكال",
                "يجب احترام آراء الآخرين وعدم فرض الرأي بالقوة في النقاشات"
            ]
        };

        const ruleButtons = document.querySelectorAll('.rule-btn');
        const rulesList = document.getElementById('rules-list');
        const rulesTitle = document.getElementById('rules-title');

        const categoryTitles = {
            concepts: "مفاهيم الرول بلاي الأساسية",
            city: "قوانين المدينة العامة",
            police: "قوانين الشرطة",
            gangs: "قوانين العصابات",
            driving: "قوانين القيادة",
            hospital: "قوانين المستشفى",
            chat: "قوانين الدردشة"
        };

        const categoryIcons = {
            concepts: "fa-book",
            city: "fa-city",
            police: "fa-car-on",
            gangs: "fa-user-secret",
            driving: "fa-car",
            hospital: "fa-ambulance",
            chat: "fa-comments"
        };

        function loadRules(ruleType) {
            rulesList.innerHTML = '';
            rulesTitle.innerHTML = `<i class="fas ${categoryIcons[ruleType]}"></i> ${categoryTitles[ruleType]}`;
            
            if (!rulesData[ruleType]) return;
            
            const fragment = document.createDocumentFragment();
            
            rulesData[ruleType].forEach((rule, index) => {
                const li = document.createElement('li');
                
                if (ruleType === 'city' && index === 0) {
                    // السطر التنبيهي الأول لقوانين المدينة
                    li.innerHTML = `⚠️ <b>${rule}</b>`;
                    li.style.borderRightColor = "#ffaa00";
                    li.style.background = "#1a1a1a";
                } else {
                    const displayIndex = ruleType === 'city' ? index : index + 1;
                    li.innerHTML = `<span class="index-num">${displayIndex}</span> ${rule}`;
                }
                
                fragment.appendChild(li);
            });
            
            rulesList.appendChild(fragment);
            rulesList.scrollTop = 0; // إعادة السكرول للأعلى بسلاسة عند التغيير
        }

        ruleButtons.forEach(button => {
            button.addEventListener('click', function() {
                const ruleType = this.getAttribute('data-rule');
                ruleButtons.forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                loadRules(ruleType);
            });
        });

        // تشغيل المفاهيم افتراضياً وبترتيب تام عند فتح الموقع
        document.addEventListener('DOMContentLoaded', () => {
            loadRules('concepts');
        });
    </script>
</body>
</html>
