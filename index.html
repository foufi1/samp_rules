<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع Crown State للقوانين</title>
    
    <!-- Meta Tags -->
    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="موقع Crown State للقوانين">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 40px;
            padding-top: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ffcc00, #ffaa00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
            font-weight: 700;
        }
        
        .logo {
            font-size: 3rem;
            color: #ffcc00;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
        }
        
        .app {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .buttons-container {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .rules-container {
            flex: 2;
            min-width: 300px;
            background: #111111;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 204, 0, 0.15);
            backdrop-filter: blur(5px);
        }
        
        .rules-container h2 {
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #ffcc00;
            border-bottom: 2px solid rgba(255, 204, 0, 0.2);
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .rules-container h2 i {
            color: #ffaa00;
        }
        
        .rules-list {
            list-style: none;
            max-height: 650px;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .rules-list::-webkit-scrollbar {
            width: 6px;
        }
        
        .rules-list::-webkit-scrollbar-track {
            background: #111111;
        }
        
        .rules-list::-webkit-scrollbar-thumb {
            background: #ffcc00;
            border-radius: 10px;
        }
        
        .rules-list li {
            padding: 15px;
            margin-bottom: 12px;
            background: #161616;
            border-radius: 10px;
            border-right: 4px solid #ffcc00;
            transition: transform 0.2s ease, background 0.2s ease;
            will-change: transform;
            font-size: 1.05rem;
            line-height: 1.7;
        }
        
        .rules-list li:hover {
            background: #1e1e1e;
            transform: translateX(-3px);
            border-right-color: #ffaa00;
        }
        
        .rules-list li span {
            font-weight: bold;
            color: #ffcc00;
            margin-left: 5px;
        }
        
        .rule-btn {
            padding: 20px 22px;
            background: #111111;
            border: 1px solid rgba(255, 204, 0, 0.1);
            border-radius: 12px;
            color: #eeeeee;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            will-change: transform;
        }
        
        .rule-btn i {
            font-size: 1.5rem;
            margin-left: 12px;
            color: #ffcc00;
            vertical-align: middle;
        }
        
        .rule-btn:hover {
            background: #161616;
            border-color: rgba(255, 204, 0, 0.3);
            color: #ffffff;
        }
        
        .rule-btn.active {
            background: #1a1a1a;
            border: 1px solid #ffcc00;
            color: #ffcc00;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.1);
        }

        .rule-btn.active i {
            color: #ffaa00;
        }
        
        @media (max-width: 768px) {
            .app { flex-direction: column; }
            header h1 { font-size: 2rem; }
            .rule-btn { padding: 16px 18px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-gavel"></i>
            </div>
            <h1>Crown State</h1>
        </header>
        
        <main class="app">
            <div class="buttons-container">
                <button class="rule-btn active" data-rule="city">
                    <div>
                        <i class="fas fa-city"></i>
                        قوانين المدينة العامة
                    </div>
                </button>
                
                <button class="rule-btn" data-rule="police">
                    <div>
                        <i class="fas fa-car-on"></i>
                        قوانين الشرطة
                    </div>
                </button>
                
                <button class="rule-btn" data-rule="gangs">
                    <div>
                        <i class="fas fa-user-secret"></i>
                        قوانين العصابات
                    </div>
                </button>
                
                <button class="rule-btn" data-rule="driving">
                    <div>
                        <i class="fas fa-car"></i>
                        قوانين القيادة
                    </div>
                </button>
                
                <button class="rule-btn" data-rule="hospital">
                    <div>
                        <i class="fas fa-ambulance"></i>
                        قوانين المستشفى
                    </div>
                </button>
                
                <button class="rule-btn" data-rule="chat">
                    <div>
                        <i class="fas fa-comments"></i>
                        قوانين الدردشة
                    </div>
                </button>
            </div>
            
            <div class="rules-container">
                <h2 id="rules-title"><i class="fas fa-gavel"></i> قوانين المدينة العامة</h2>
                <ul class="rules-list" id="rules-list">
                    <!-- سيتم ملء القوانين تلقائياً -->
                </ul>
            </div>
        </main>
    </div>

    <script>
        // بيانات القوانين مرتبة ومنظمة بالكامل بدون أخطاء نصية
        const rulesData = {
            city: [
                "الالتزام بهذه المصطلحات داخل المدينة ضروري، أي تهاون في هذه القوانين يصدر عنه عقوبات صارمة.",
                "Server : يعني المدينة",
                "Ban : يعني عمرة",
                "Admin : يعني شبح / جن",
                "Bot : يعني مدني",
                "Skin : يعني لباس",
                "id : يعني سيسيبي (ccp)",
                "Lag / Glitch : يعني سحر / صداع",
                "Discord : يعني الراديو الكبير",
                "Announce : يعني الجريدة",
                "Mic : يعني الحنجرة / أحبال صوتية",
                "Restart Server : يعني إعصار",
                "Afk : يعني راه معا مخو",
                "Chat : يعني الورقة",
                "Stash / Cmd : يعني عضلة",
                "Rules : يعني القوانين / الدستور",
                "Record : يعني العين ( 👀 )"
            ],
            police: [
                "يجب على ضباط الشرطة الالتزام بالزي الرسمي للشرطة أثناء الخدمة",
                "يمنع على ضباط الشرطة استخدام القوة المفرطة ضد المواطنين",
                "يجب إبلاغ المشتبه بهم بحقوقهم قبل توقيفهم أو استجوابهم",
                "يمنع على ضباط الشرطة تقديم معلومات كاذبة أو تلفيق تهم",
                "يجب على ضباط الشرطة الحفاظ على السرية المهنية وعدم إفشاء معلومات خاصة",
                "يمنع استخدام مركبات الشرطة لأغراض شخصية غير رسمية",
                "يجب على ضباط الشرطة تقديم تقارير دقيقة عن جميع الحوادث التي يشاركون فيها",
                "يمنع التعاون مع المجرمين أو العصابات بأي شكل من الأشكال"
            ],
            gangs: [
                "يجب على أعضاء العصابات الالتزام بلباس العصابة المميز أثناء الأنشطة",
                "يمنع الاعتداء على المدنيين العزل دون سبب مقنع يتناسب مع سياق الرول بلاي",
                "يجب الحصول على إذن من قادة العصابة قبل البدء بأي عملية إجرامية كبرى",
                "يمنع التعاون مع أفراد الشرطة أو الكشف عن معلومات العصابة لهم",
                "يجب احترام مناطق النفوذ للعصابات الأخرى وعدم التعدي عليها دون سبب",
                "يمنع قتل أو اعتقال أعضاء العصابة من قبل بعضهم البعض دون سبب مقنع",
                "يجب الحفاظ على سرية هوية أعضاء العصابة وأنشطتها من العامة",
                "يمنع تجنيد أعضاء جدد دون موافقة قادة العصابة"
            ],
            driving: [
                "يجب الالتزام بإشارات المرور والقواعد العامة للقيادة داخل المدينة",
                "يمنع القيادة بسرعة عالية في المناطق السكنية أو المزدحمة",
                "يجب حمل رخصة قيادة سارية المفعول أثناء القيادة",
                "يمنع القيادة بمركبة مسروقة بشكل واضح في مناطق الشرطة",
                "يجب إصلاح المركبات التالفة قبل استخدامها على الطرقات العامة",
                "يمنع إجراء سباقات السيارات غير المصرح بها في الشوارع العامة",
                "يجب الوقوف عند نقاط التفتيش الشرطية عند الطلب",
                "يمنع استخدام المركبات كأداة للاعتداء على الآخرين عمداً"
            ],
            hospital: [
                "يجب على الأطباء والممرضين الالتزام بالزي الطبي الرسمي أثناء العمل",
                "يمنع رفض تقديم العلاج للمرضى أو المصابين دون سبب طبي مقنع",
                "يجب الحفاظ على سرية المعلومات الطبية للمرضى وعدم إفشائها",
                "يمنع تزوير التقارير الطبية أو إصدار شهادات مزورة",
                "يجب تقديم الإسعافات الأولية فوراً للحالات الطارئة",
                "يمنع استخدام معدات المستشفى أو الأدوية لأغراض شخصية",
                "يجب التعامل باحترافية واحترام مع جميع المرضى بغض النظر عن هويتهم",
                "يمنع التعاون مع المجرمين في تزوير الإصابات أو تقديم معلومات كاذبة"
            ],
            chat: [
                "يمنع استخدام لغة غير لائقة أو مهينة في القنوات العامة",
                "يجب استخدام القنوات المناسبة لنوع المحادثة (عام، محلي، خاص)",
                "يمنع الإعلان عن منتجات أو خدمات غير مصرح بها في القنوات العامة",
                "يجه عدم نشر معلومات شخصية للاعبين آخرين دون إذنهم",
                "يمنع التشويش أو إرسال رسائل متكررة في القنوات النصية أو الصوتية",
                "يجب استخدام اللغة العربية الفصحى أو العامية المفهومة في المحادثات",
                "يمنع التحريض على العنف أو الكراهية بأي شكل من الأشكال",
                "يجب احترام آراء الآخرين وعدم فرض الرأي بالقوة في النقاشات"
            ]
        };

        // عناصر DOM
        const ruleButtons = document.querySelectorAll('.rule-btn');
        const rulesList = document.getElementById('rules-list');
        const rulesTitle = document.getElementById('rules-title');

        const categoryTitles = {
            city: "قوانين المدينة العامة",
            police: "قوانين الشرطة",
            gangs: "قوانين العصابات",
            driving: "قوانين القيادة",
            hospital: "قوانين المستشفى",
            chat: "قوانين الدردشة"
        };

        const categoryIcons = {
            city: "fa-city",
            police: "fa-car-on",
            gangs: "fa-user-secret",
            driving: "fa-car",
            hospital: "fa-ambulance",
            chat: "fa-comments"
        };

        // دالة عرض القوانين بسلاسة وبدون لاق
        function loadRules(ruleType) {
            rulesList.innerHTML = '';
            rulesTitle.innerHTML = `<i class="fas ${categoryIcons[ruleType]}"></i> ${categoryTitles[ruleType]}`;
            
            if (!rulesData[ruleType]) return;
            
            // إنشاء العناصر دفعة واحدة لزيادة الأداء وسلاسة التصفح
            const fragment = document.createDocumentFragment();
            
            rulesData[ruleType].forEach((rule, index) => {
                const li = document.createElement('li');
                
                // الترتيب الرقمي لجميع القوانين بما فيها المدينة
                if (ruleType === 'city' && index === 0) {
                    li.innerHTML = `⚠️ <b>${rule}</b>`;
                    li.style.borderRightColor = "#ffaa00";
                    li.style.background = "#1a1a1a";
                } else {
                    // إذا كنا في قوانين المدينة نبدأ الترقيم من بعد الجملة التنبيهية الأولى
                    const displayIndex = ruleType === 'city' ? index : index + 1;
                    li.innerHTML = `<span>${displayIndex}.</span> ${rule}`;
                }
                
                fragment.appendChild(li);
            });
            
            rulesList.appendChild(fragment);
        }

        // تفعيل أزرار القوانين والتبديل السريع
        ruleButtons.forEach(button => {
            button.addEventListener('click', function() {
                const ruleType = this.getAttribute('data-rule');
                
                // تبديل الفئة النشطة
                ruleButtons.forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                
                loadRules(ruleType);
            });
        });

        // تشغيل الصفحة على قوانين المدينة افتراضياً عند التحميل
        document.addEventListener('DOMContentLoaded', () => {
            loadRules('city');
        });
    </script>
</body>
</html>
